name: Build Attila Serbian Trainer

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Trainer
        run: msbuild AttilaSerbianTrainerCPP.sln /m /p:Configuration=Release /p:Platform=x86

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: AttilaSerbianTrainer
          path: bin/Release/AttilaSerbianTrainer.exe
